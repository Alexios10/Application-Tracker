    <!-- Sets the theme before the page is drawn, so dark mode users don't see a white flash.
         Uses the same storage key ("theme") as next-themes. -->
    <script>
      try {
        var theme = localStorage.getItem("theme") || "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
